#
# HOW TO USE:
#   1. Push this file to your GitHub repository.
#   2. Go to GitHub → Settings → Secrets and variables → Actions
#   3. Add the following Repository Secrets:
#        NEON_API_KEY              (from console.neon.tech)
#        SUPABASE_ACCESS_TOKEN     (from supabase.com/dashboard/account/tokens)
#        AWS_ACCESS_KEY_ID         (optional — only if you use AWS)
#        AWS_SECRET_ACCESS_KEY     (optional — only if you use AWS)
#   4. That's it — push to main and Sajon deploys automatically!
#

name: 'Sajon Cloud Deploy'

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel any in-progress deployment when a new push arrives.
concurrency:
  group: sajon-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Plan: Dry-run on every Pull Request ───────────────────────
  plan:
    name: 'sajon plan (Dry Run)'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Sajon CLI
        run: |
          curl -sSfL https://github.com/sajon-lang/sajon/releases/latest/download/sajon-linux-amd64 \
            -o sajon && chmod +x sajon

      - name: Run Sajon Plan (No API Calls)
        run: ./sajon plan app.saj

  # ── Deploy: Provision on push to main / master ────────────────
  deploy:
    name: 'sajon up (Live Deploy)'
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Sajon CLI
        run: |
          curl -sSfL https://github.com/sajon-lang/sajon/releases/latest/download/sajon-linux-amd64 \
            -o sajon && chmod +x sajon

      - name: Provision Infrastructure
        run: ./sajon up app.saj
        env:
          # ── Database credentials (add these in GitHub Secrets) ──
          NEON_API_KEY:              ${{ secrets.NEON_API_KEY }}
          SUPABASE_ACCESS_TOKEN:     ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORG_ID:           ${{ secrets.SUPABASE_ORG_ID }}
          # ── AWS credentials (optional) ───────────────────────────
          AWS_ACCESS_KEY_ID:         ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:     ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:        ${{ secrets.AWS_DEFAULT_REGION }}
          # ── Optional: S3 remote state ────────────────────────────
          SAJON_REMOTE_BUCKET:       ${{ secrets.SAJON_REMOTE_BUCKET }}

      - name: Upload sajon.env as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sajon-env-${{ github.run_number }}
          path: sajon.env
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload sajon.lock as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sajon-lock-${{ github.run_number }}
          path: sajon.lock
          retention-days: 30
          if-no-files-found: ignore
